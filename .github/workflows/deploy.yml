# push하면 알아서 빌드해서 올린다.
#
# 왜 이렇게 하냐면 — 손으로 dist 폴더를 올리는 방식은 언젠가 반드시
# "고쳤는데 왜 그대로지" 하는 날이 온다. 빌드를 깜빡한 건지, 올리다 만 건지
# 알 수가 없다. 사람이 기억해야 하는 단계는 없애는 게 맞다.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # 코드 안 고치고 그냥 다시 올리고 싶을 때 버튼으로

permissions:
  contents: read
  pages: write
  id-token: write

# 연달아 push해도 마지막 것만 살아남게. 중간 배포가 겹쳐서 꼬이는 걸 막는다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc까지 돌린다. 타입 에러가 있으면 여기서 멈추고 배포되지 않는다.
      # 깨진 걸 친구들이 먼저 보는 것보단 낫다.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
